apiVersion: v1
kind: Service
metadata:
  name: wasm-artcraft
  labels:
    app: wasm-artcraft
    # The AddonService discovers add-ons by this label (ADR-034).
    oriso.io/addon: "true"
  annotations:
    oriso.io/addon-port: "8080"
spec:
  selector:
    app: wasm-artcraft
  ports:
    - name: http
      port: 8080
      targetPort: http

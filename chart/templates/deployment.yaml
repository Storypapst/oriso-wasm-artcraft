apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasm-artcraft
  labels:
    app: wasm-artcraft
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: wasm-artcraft
  template:
    metadata:
      labels:
        app: wasm-artcraft
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: wasm-artcraft
          {{- if hasPrefix "sha256:" (toString .Values.image.tag) }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.tag }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
